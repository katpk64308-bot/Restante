<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="stylemidia.css">
    <link rel="stylesheet" href="https://cloudflare.com">

    <title>Sakura Nami</title>
</head>

<style>
    .social-container {
        display: flex;
        gap: 20px;
        padding: 20px;
        justify-content: center;
    }

    .icon-link svg {
        width: 40px;
        height: 40px;
        fill: #555555;
        transition: fill 0.3s ease, transform 0.2s ease;
    }

    .icon-link:hover svg {
        transform: scale(1.1);
    }

    .tiktok:hover svg {
        fill: #ffffff;
    }

    .instagram:hover svg {
        fill: #E1306C;
    }

    .facebook:hover svg {
        fill: #1877F2;
    }

    .youtube:hover svg {
        fill: #500c0c;
    }
.contatos-container {
  display: flex;
  flex-direction: column;
  gap: 15px;
  width: fit-content;
  margin: 20px auto 0;
  align-items: center;
}

.contato-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icone-link {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  width: 45px;
  height: 45px;
  background-color: #f0f0f0;
  border-radius: 24px;
  transition: all 0.3s ease;
}

.icone-link svg {
  width: 22px;
  height: 22px;
  fill: #333;
  transition: fill 0.3s ease;
}

.icone-link.telefone:hover {
  background-color: #007bff;
}
.icone-link.telefone:hover svg {
  fill: #fff;
}

.icone-link.whatsapp:hover {
  background-color: #25d366;
}
.icone-link.whatsapp:hover svg {
  fill: #fff;
}

.icone-link.email:hover {
  background-color: #ea4335;
}
.icone-link.email:hover svg {
  fill: #fff;
}

.icone-link.maps:hover {
  background-color: #34a853;
}
.icone-link.maps:hover svg {
  fill: #fff;
}

.icone-link p {
  margin: 0;
  color: #333;
}

.horarios-box {
  width: min(90%, 620px);
  margin: 28px auto 0;
  padding: 16px 22px;
  display: grid;
  grid-template-columns: 45px minmax(0, 1fr);
  align-items: flex-start;
  gap: 16px;
  border: 2px solid #e00000;
  border-radius: 8px;
  text-align: left;
}

.horarios-box .relogio {
  grid-column: 1;
  grid-row: 1 / span 2;
}

.horarios-conteudo h3 {
  margin: 4px 0 10px;
}

.horarios-box > h3 {
  grid-column: 2;
  grid-row: 1;
}

.horarios-box > .horarios-conteudo {
  grid-column: 2;
  grid-row: 2;
}

.horarios-linhas p {
  margin: 5px 0;
}

</style>

<body>
    <div class="spaso">
        <div class="logo">
            <img src="img/logo.png">

            <div class="logo-texto">
                <h1>Sakura<span> Nami</span></h1>
                <p><span>------ </span>Restaurante japonês<span> ------</span></p>
            </div>
        </div>
        <nav>
            <ul>
                <li onclick="navegar('home')" id="aba-home" style="display: inline;">Inicio</li>
                <li onclick="navegar('contato')" id="aba-contato" style="display: inline;">Contato</li>
            </ul>
        </nav>
    </div>

    
    <div id="conteudo"></div>
    <script src="script.js"></script>
</body>

</html>
