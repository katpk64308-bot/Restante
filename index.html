<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="stylemidia.css">
    <link rel="stylesheet" href="https://cloudflare.com">

    <title>Sakura Nami</title>
</head>

<style>
    .social-container {
      display: flex;
      gap: 20px;
      padding: 20px;
      justify-content: center;
    }

    /* Estilos base dos ícones */
    .icon-link svg {
      width: 40px;
      height: 40px;
      fill: #555555; /* Cor cinza padrão para todos */
      transition: fill 0.3s ease, transform 0.2s ease;
    }

    /* Efeito de aumentar levemente ao passar o mouse */
    .icon-link:hover svg {
      transform: scale(1.1);
    }

    /* Cores oficiais de cada marca no Hover */
    .tiktok:hover svg { fill: #ffffff; }
    .instagram:hover svg { fill: #E1306C; }
    .facebook:hover svg { fill: #1877F2; }
    .youtube:hover svg { fill: #FF0000; }
</style>
<body>
    <div class="spaso">
        <div class="logo">
            <img src="img/logo.png">

            <div class="logo-texto">
                <h1>Sakura<span> Nami</span></h1>
                <p><span>------ </span>Restaurante japonês<span> ------</span></p>
            </div>
        </div>
        <nav>
            <ul>
                <li onclick="navegar('home')" id="aba-home" style="display: inline;">Inicio</li>
                <li onclick="navegar('contato')" id="aba-contato" style="display: inline;">Contato</li>
            </ul>
        </nav>
    </div>
   
    <div id="conteudo"></div>
    <script src="script.js"></script>
</body>

</html>
